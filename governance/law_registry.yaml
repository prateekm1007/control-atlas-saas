#      source, protected by canon hash 6a9cd4b4349b81de. Values here are
#      copied EXACTLY from it. Never edit one side without the other.
#   2. This registry — documents every law: enforced, declared, or retired.
#   3. Glossary text (backend/tos/glossary/**) — derived from this registry.
#
# Fields per entry:
#   id            LAW-<n>            (IDs are never renumbered or reused)
#   title                            (exactly as in LAW_CANON for enforced laws)
#   tier          deterministic | heuristic | advisory
#   status        enforced | declared | retired
#   threshold / units / operator / scope / type   (copied from LAW_CANON)
#   implementation                   module::callable that measures the law
#   test                             test file covering it (dedicated: true/false)
#   cited_in                         paper / doc files citing this law
#
# Content hash of this file is pinned in backend/tests/test_law_registry.py
# and mirrored in governance/law_registry.sha256.
