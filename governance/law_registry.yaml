# =============================================================================
# Law Registry — single source of governance documentation (WP-8)
# =============================================================================
# AUTHORITY CHAIN (do not break):
#   1. backend/tos/governance/station_sop.py  (LAW_CANON) — enforced runtime
#      source, protected by canon hash 6a9cd4b4349b81de. Values here are
#      copied EXACTLY from it. Never edit one side without the other.
#   2. This registry — documents every law: enforced, declared, or retired.
#   3. Glossary text (backend/tos/glossary/**) — derived from this registry.
#
# Fields per entry:
#   id            LAW-<n>            (IDs are never renumbered or reused)
#   title                            (exactly as in LAW_CANON for enforced laws)
#   tier          deterministic | heuristic | advisory
#   status        enforced | declared | retired
#   threshold / units / operator / scope / type   (copied from LAW_CANON)
#   implementation                   module::callable that measures the law
#   test                             test file covering it (dedicated: true/false)
#   cited_in                         paper / doc files citing this law
#
# Content hash of this file is pinned in backend/tests/test_law_registry.py
# and mirrored in governance/law_registry.sha256.
# =============================================================================

registry_version: "1.1.0"
authority:
  runtime_source: "backend/tos/governance/station_sop.py::LAW_CANON"
  canon_hash: "6a9cd4b4349b81de"
  matrix_hash: "ed1731ace09a9a3bd24d3659ab6f3fd184da2a2335d935a234fd6a9c14880aa4"
  method_classification_source: "backend/tos/governance/station_sop.py::LAW_METHOD_CLASSIFICATIONS"

# WP-SCI-1 (directive §2, Constitution §4): every law row carries exactly one
# of these statuses. An empty sample is never a zero-valued measurement and
# never a favorable PASS; missing mandatory measurements on deterministic
# laws prevent an authoritative PASS (adjudicator yields INDETERMINATE);
# NOT_APPLICABLE laws neither pass nor veto; MEASUREMENT_FAILED is an
# explicit non-success state for acquisition/tooling errors.
status_semantics:
  measured_success: PASS
  measured_violation: VETO
  measured_failure: FAIL
  empty_sample: NOT_MEASURED
  not_applicable: NOT_APPLICABLE
  acquisition_failure: MEASUREMENT_FAILED

laws:
  # ── enforced (all 15 pinned laws, values copied exactly) ──────────────────

  - id: LAW-100
    title: Bond Integrity
    tier: deterministic
    status: enforced
    threshold: 5.0
    units: "%"
    operator: "<="
    scope: core residues
    type: Percentage
    measures: >
      Percentage of covalent bonds whose length deviates more than 4 sigma
      from Engh-Huber ideals (predicted mode), or the RMS z-score (RMSZ,
      experimental mode), across core residues.
    implementation: "backend/tos/engine/tier1_measurements.py::Tier1Measurements.run_full_audit (LAW-100 block)"
    test: {file: backend/tests/test_math_migration.py, dedicated: false}
    cited_in: [TRUST_MATRIX_v22.5.3.md, "station_sop.py calibration notes (Engh & Huber 1991)"]

  - id: LAW-105
    title: Reliability Coverage
    tier: deterministic
    status: enforced
    threshold: 70.0
    units: "%"
    operator: ">="
    scope: total residues
    type: Percentage
    measures: >
      Percentage of residues passing the reliability filter: mean B-factor /
      pLDDT >= 70 for predicted structures; 100% for experimental structures.
      Governs the PASS vs INDETERMINATE coverage gate.
    implementation: "backend/tos/engine/tier1_measurements.py::Tier1Measurements.run_full_audit (LAW-105 block)"
    test: {file: backend/tests/test_math_migration.py, dedicated: false}
    cited_in: [TRUST_MATRIX_v22.5.3.md]

  - id: LAW-110
    title: Backbone Gap
    tier: deterministic
    status: enforced
    threshold: 2.0
    units: "Å"
    operator: "<="
    scope: sequential pairs
    type: Scalar
    measures: >
      Count of sequential same-chain C(i)-N(i+1) peptide distances exceeding
      2.0 Angstrom (missing-residue gaps). Observed value is the gap count.
    implementation: "backend/tos/engine/tier1_measurements.py::Tier1Measurements.run_full_audit (LAW-110 block)"
    test: {file: backend/tests/test_math_migration.py, dedicated: false}
    cited_in: ["station_sop.py calibration notes (Word et al. 1999)"]

  - id: LAW-120
    title: Bond Angle
    tier: deterministic
    status: enforced
    containment:
      state: contained
      reason: measurement-definition-repair
      since: "2026-10-19"
      detail: >
        The pinned 18.0 deg threshold was selected from the v23 cohort using
        the UNCORRECTED metric (O(i)-C(i)-N(i)) and is not validated for the
        corrected metric. Until the v24 diagnostic run and the independent
        validation protocol (backend/calibration/protocol/
        evaluation_protocol_v1.md) meet their acceptance criteria, a
        measured LAW-120 VETO cannot independently issue an authoritative
        VETO (adjudicator yields INDETERMINATE with containment provenance).
    threshold: 18.0
    units: "°"
    operator: "<="
    scope: core residues
    type: RMSD
    measurement_definition_version: 2
    measures: >
      RMS deviation of backbone bond angles from Engh-Huber ideals, in
      degrees. Measured triples (WP-SCI-1 definition v2): intra-residue
      N(i)-CA(i)-C(i); peptide carbonyl O(i)-C(i)-N(i+1) using the NEXT
      residue's nitrogen; and CA(i)-C(i)-N(i+1) — the latter two only for
      valid sequential same-chain pairs (shared adjacency predicate;
      insertion codes honored; chains never joined; missing spans skipped).
      Ideals (IDEAL_TABLE): N-CA-C 111.0°, O-C-N 123.0°, CA-C-N 116.6°.
      Definition v1 incorrectly measured O(i)-C(i)-N(i) — a non-bonded
      pseudo-angle — against the peptide ideal. NOT a peptide-bond-length
      check — bond lengths are LAW-100's measurement. Empty sample yields
      NOT_MEASURED, never a favorable zero.
    implementation: "backend/tos/engine/tier1_measurements.py::Tier1Measurements.run_full_audit (LAW-120 block)"
    test: {file: backend/tests/test_law_120.py, dedicated: true}
    cited_in: [TRUST_MATRIX_v22.5.3.md, "Engh & Huber (1991), Acta Cryst. A47, 392-400"]

  - id: LAW-125
    title: Ramachandran
    tier: deterministic
    status: enforced
    threshold: 5.0
    units: "%"
    operator: "<="
    scope: core residues
    type: Percentage
    measures: >
      Percentage of core residues with (phi, psi) pairs in disallowed
      Ramachandran regions.
    implementation: "backend/tos/engine/tier1_measurements.py::Tier1Measurements.run_full_audit (LAW-125 block)"
    test: {file: backend/tests/test_math_migration.py, dedicated: false}
    cited_in: [TRUST_MATRIX_v22.5.3.md]

  - id: LAW-130
    title: Clashscore
    tier: deterministic
    status: enforced
    threshold: 20.0
    units: "clashes/1000 atoms"
    operator: "<="
    scope: total atoms
    type: Rate
    measures: >
      Number of non-bonded steric clashes per 1000 atoms (atom pairs closer
      than their combined van der Waals radii allow).
    implementation: "backend/tos/engine/tier1_measurements.py::Tier1Measurements.run_full_audit (LAW-130 block)"
    test: {file: backend/tests/test_math_migration.py, dedicated: false}
    cited_in: []

  - id: LAW-135
    title: Omega Planarity
    tier: deterministic
    status: enforced
    threshold: 3.0
    units: "%"
    operator: "<="
    scope: core residues
    type: Percentage
    measures: >
      Percentage of peptide omega (C-N) dihedral angles deviating beyond
      planarity tolerance (cis/trans exceptions handled).
    implementation: "backend/tos/engine/tier1_measurements.py::Tier1Measurements.run_full_audit (LAW-135 block)"
    test: {file: backend/tests/test_law_135.py, dedicated: true}
    cited_in: []

  - id: LAW-145
    title: Chirality
    tier: deterministic
    status: enforced
    threshold: 0.0
    units: count
    operator: "="
    scope: core residues
    type: Count
    measures: >
      Count of L-amino-acid chirality inversions, measured as the sign of
      the N-CA-C-CB improper dihedral (negative = L, positive = inversion).
    implementation: "backend/tos/engine/tier1_measurements.py::Tier1Measurements.run_full_audit (LAW-145 block)"
    test: {file: backend/tests/test_law_145.py, dedicated: true}
    cited_in: []

  - id: LAW-150
    title: Rotamer Audit
    tier: deterministic
    status: enforced
    threshold: 20.0
    units: "%"
    operator: "<="
    scope: core residues
    type: Percentage
    measures: >
      Percentage of core residues whose chi-1 side-chain dihedral falls
      outside known rotamer wells.
    implementation: "backend/tos/engine/tier1_measurements.py::Tier1Measurements.run_full_audit (LAW-150 block)"
    test: {file: backend/tests/test_law_150.py, dedicated: true}
    cited_in: []

  - id: LAW-155
    title: Voxel Occupancy
    tier: heuristic
    status: enforced
    threshold: 2.0
    units: V
    operator: ">="
    scope: atomic grid
    type: Scalar
    measures: >
      Heuristic voxel-occupancy score: average number of occupied grid
      voxels per residue over an atomic occupancy grid. This is an
      occupancy-density heuristic — it is NOT a deterministic
      atoms-cannot-overlap rule (owner decision, brief §4.1: the pinned
      code is the authority). Heuristic failures do not by themselves
      trigger VETO.
    implementation: "backend/tos/engine/tier1_measurements.py::Tier1Measurements.run_full_audit (LAW-155 block)"
    test: {file: backend/tests/test_law_155.py, dedicated: true}
    cited_in: [TRUST_MATRIX_v22.5.3.md]

  - id: LAW-160
    title: Chain Integrity
    tier: deterministic
    status: enforced
    threshold: 4.5
    units: "Å"
    operator: "<="
    scope: sequential C-alphas
    type: Scalar
    measurement_definition_version: 2
    measures: >
      Maximum C-alpha to C-alpha distance between IMMEDIATELY SEQUENTIAL
      same-chain residue pairs (WP-SCI-1 definition v2, shared adjacency
      predicate: residue numbers differing by exactly one with insertion
      codes honored; chains never joined). A missing residue span
      (numbering gap, e.g. 45 -> 67) is absent density, not a physical
      chain break, and is skipped; genuine coordinate discontinuities
      between adjacent-numbered residues still veto. Ideal ~3.8 Angstrom.
      Values above 4.5 Angstrom indicate a chain break. Observed value is
      the max gap in Angstrom; empty sample yields NOT_MEASURED.
    implementation: "backend/tos/engine/tier1_measurements.py::Tier1Measurements.run_full_audit (LAW-160 block)"
    test: {file: backend/tests/test_law_160.py, dedicated: true}
    cited_in: [TRUST_MATRIX_v22.5.3.md, "station_sop.py calibration notes (Ramachandran & Sasisekharan 1968)"]

  - id: LAW-170
    title: Residue Identity
    tier: deterministic
    status: enforced
    threshold: 0.0
    units: count
    operator: "="
    scope: total residues
    type: Count
    measures: >
      Count of residues whose names are not in the standard 20 amino-acid
      set. Non-standard residue names fail this law.
    implementation: "backend/tos/engine/tier1_measurements.py::Tier1Measurements.run_full_audit (LAW-170 block)"
    test: {file: backend/tests/test_math_migration.py, dedicated: false}
    cited_in: [TRUST_MATRIX_v22.5.3.md]

  - id: LAW-182
    title: Hydrophobic Burial
    tier: heuristic
    status: enforced
    threshold: 0.3
    units: ratio
    operator: ">="
    scope: hydrophobic core
    type: Rate
    measures: >
      Per-chain ratio of hydrophobic residues buried within 15 Angstrom of
      the chain centroid. Evaluated per chain (multi-chain complexes are
      not penalised by a shared centroid).
    implementation: "backend/tos/engine/tier1_measurements.py::Tier1Measurements.run_full_audit (LAW-182 block)"
    test: {file: backend/tests/test_law_182.py, dedicated: true}
    cited_in: []

  - id: LAW-195
    title: Disulfide Geometry
    tier: deterministic
    status: enforced
    threshold: 0.20
    units: "Å"
    operator: "<="
    scope: cys pairs
    type: Scalar
    measurement_definition_version: 2
    measures: >
      Maximum deviation of cysteine SG-SG distances from the ideal 2.033
      Angstrom disulfide bond length, over putative disulfide pairs
      (SG-SG < 3.0 Angstrom). WP-SCI-1: a structure with NO applicable
      disulfide pair is recorded as NOT_APPLICABLE (sample 0) — it has
      neither passed nor violated this law.
    implementation: "backend/tos/engine/tier1_measurements.py::Tier1Measurements.run_full_audit (LAW-195 block)"
    test: {file: backend/tests/test_law_195.py, dedicated: true}
    cited_in: ["Engh & Huber (1991), Acta Cryst. A47, 392-400"]

  - id: LAW-200
    title: Packing Quality
    tier: heuristic
    status: enforced
    threshold: 300.0
    units: "Å³/atom"
    operator: "<="
    scope: bounding box
    type: Rate
    measures: >
      Heuristic packing density: structure bounding-box volume divided by
      atom count, in cubic Angstroms per atom. Sparse packing suggests an
      implausibly expanded model. NOT a binding-cavity volume rule (owner
      decision, brief §4.1 applies: code is the authority).
    implementation: "backend/tos/engine/tier1_measurements.py::Tier1Measurements.run_full_audit (LAW-200 block)"
    test: {file: backend/tests/test_law_200.py, dedicated: true}
    cited_in: []

