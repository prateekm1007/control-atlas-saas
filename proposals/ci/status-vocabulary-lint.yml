# INERT DRAFT — activates only on owner approval (EC-22), see move-map in proposals/ci/README.md
name: EC22 status vocabulary
on:
  pull_request:
permissions:
  contents: read
jobs:
  vocabulary:
    name: EC-22 machine-checkable statuses computed from run records
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the runs manifest from GitHub Actions records for this candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every RUN_PASS citation is validated against real workflow-run records for the
          # exact head SHA (fabricated IDs / wrong-SHA runs / non-success runs fail).
          python3 - <<'PY'
          import json, os, urllib.request
          slug, sha = os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_SHA"]
          tok = os.environ["GH_TOKEN"]
          def api(url):
              req = urllib.request.Request(url, headers={"Authorization": f"token {tok}",
                                          "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())
          runs, page = {}, 1
          while page <= 10:
              d = api(f"https://api.github.com/repos/{slug}/actions/runs?head_sha={sha}&per_page=100&page={page}")
              for r in d.get("workflow_runs", []):
                  runs[str(r["id"])] = {"head_sha": r["head_sha"],
                                        "conclusion": r["conclusion"],
                                        "name": r.get("name", "")}
              if d.get("workflow_runs") and len(d["workflow_runs"]) == 100:
                  page += 1
              else:
                  break
          json.dump({"runs": runs}, open(os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"),
                                                     "runs_manifest.json"), "w"))
          print(f"manifest: {len(runs)} run(s) recorded for {sha[:12]}")
          PY
      - run: |
          FILES=$(git ls-files 'docs/evidence/*.md' 'docs/evidence/**/*.md' 'docs/audit-evidence/**/*.md' 'outputs/*.md' '*STATUS*.md' 2>/dev/null || true)
          [ -n "$FILES" ] || { echo "no status-bearing files found; nothing to lint"; exit 0; }
          # shellcheck disable=SC2086
          python3 scripts/ci/status_vocabulary_lint.py $FILES \
            --runs-manifest "$RUNNER_TEMP/runs_manifest.json"
