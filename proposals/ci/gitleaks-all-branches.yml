# INERT DRAFT — activates only on owner approval (EC-23), see move-map in proposals/ci/README.md
name: EC23 full-tree secret scan
on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"   # weekly Monday 05:00 UTC full-history scan of main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    name: EC-23 gitleaks full history of the checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history is the scan target, not the push range
      - name: Verify complete history (a partial clone must not be scanned and called full)
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "FAIL: shallow checkout; full-history scan not possible"; exit 1
          fi
          git rev-list --count HEAD >/dev/null && echo "history depth OK"
      # Action pinned to a reviewed immutable commit SHA (NEVER a moving tag):
      # gitleaks/gitleaks-action v2 branch head, verified via the GitHub commits API
      # on 2026-10-20 (committer date 2025-04-17T01:54:17Z). Uploads/comments disabled so
      # the job needs only contents: read (no security-events: write).
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: v8.30.1
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"

  gitleaks-all-refs:
    name: EC-23 gitleaks across ALL refs (including evidence-only branches)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch every remote ref explicitly (evidence branches included)
        run: |
          git fetch --prune --no-tags origin "+refs/heads/*:refs/remotes/origin/*"
          git rev-list --all --count >/dev/null
          git branch -r | tee /tmp/refs_scanned.txt | wc -l
      - name: Run pinned gitleaks binary over --all with checksum verification
        env:
          GITLEAKS_VER: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks && chmod +x /tmp/gitleaks
          # --log-opts="--all" scans the history of EVERY ref fetched above; --redact keeps
          # any finding's secret value out of the job log; exit code gates the job.
          /tmp/gitleaks detect --source . --log-opts="--all" --redact --verbose \
            --report-path /tmp/gitleaks_all_refs.json || {
              echo "FAIL: gitleaks findings across all refs (report kept as artifact, redacted)";
              cp /tmp/gitleaks_all_refs.json "$RUNNER_TEMP/" 2>/dev/null || true;
              exit 1; }
          echo "PASS: no secrets across all refs and full history"

  seeded-secret-detection-test:
    name: EC-23 the scan actually detects (safe seeded fixture, expects failure)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Positive control — seeded fake key MUST be detected (nonzero exit)
        run: |
          set -uo pipefail
          # Safe fixture: Amazon's DOCUMENTED example key (AKIAIOSFODNN7EXAMPLE / the
          # published wJalr... example secret). Not a real credential; never committed to
          # this repository; --redact keeps it out of the log.
          rm -rf /tmp/seedrepo && mkdir -p /tmp/seedrepo && cd /tmp/seedrepo
          git init -q && git config user.email t@t && git config user.name t
          printf 'aws_access_key_id = AKIAIOSFODNN7EXAMPLE\n' > fixture.txt
          git add fixture.txt && git commit -qm "seeded fixture"
          GITLEAKS_VER=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL --retry 3 -o gl.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks && chmod +x gitleaks
          set +e
          ./gitleaks detect --source . --log-opts="--all" --redact --verbose > /tmp/seed_scan.log 2>&1
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "FAIL: seeded fake key was NOT detected - the scan is not trustworthy"; exit 1
          fi
          grep -q "AKIAIOSFODNN7EXAMPLE" /tmp/seed_scan.log && {
            echo "FAIL: --redact did not suppress the secret value in output"; exit 1; }
          echo "PASS: seeded fake key detected (exit $RC) and value redacted in output"
      - name: Negative control — clean repo MUST pass (exit 0)
        run: |
          rm -rf /tmp/cleanrepo && mkdir -p /tmp/cleanrepo && cd /tmp/cleanrepo
          git init -q && git config user.email t@t && git config user.name t
          echo "just a clean file" > clean.txt
          git add clean.txt && git commit -qm "clean"
          /tmp/seedrepo/gitleaks detect --source . --log-opts="--all" --redact \
            || { echo "FAIL: clean repo flagged"; exit 1; }
          echo "PASS: clean repo exits 0"
