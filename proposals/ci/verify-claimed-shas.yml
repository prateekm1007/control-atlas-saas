# INERT DRAFT — activates only on owner approval (EC-16/19/20), see move-map in proposals/ci/README.md
name: EC16-19-20 claim verification
on:
  pull_request:
    types: [opened, edited, synchronize]
permissions:
  contents: read
jobs:
  claimed-shas:
    name: EC-16 claimed SHAs exist on remote (strict, fail-closed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # PR body is user-controlled: written to a step file via env (no eval, no interpolation
          # into shell commands); the checker never prints credentials.
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.md"
          GIT_TERMINAL_PROMPT=0 python3 scripts/ci/verify_claimed_shas.py \
            --body "$RUNNER_TEMP/pr_body.md" --repo "${{ github.repository }}"
  pr-fields:
    name: EC-19 directive ID present
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.md"
          python3 scripts/ci/verify_claimed_shas.py --body "$RUNNER_TEMP/pr_body.md" \
            --require-directive-id-only
  acceptance-tests-executed:
    name: EC-20 named acceptance tests EXECUTED on this candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest
      - env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.md"
          # Identifiers are validated against pytest --collect-only and executed via argument
          # arrays (no shell interpolation of user-controlled test IDs).
          python3 scripts/ci/verify_claimed_shas.py --body "$RUNNER_TEMP/pr_body.md" \
            --check-tests --evidence-out "$RUNNER_TEMP/ec20_evidence.json"
      - name: Upload EC-20 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ec20-acceptance-test-evidence
          path: ${{ runner.temp }}/ec20_evidence.json
