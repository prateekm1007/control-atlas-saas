name: Toscanini Stability Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks (pinned v8.30.1)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan HEAD tree — fails on any finding
        run: /tmp/gitleaks detect --no-git --redact --exit-code 1 -v

  unit-tests:
    name: Unit Tests + Hash Lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # WP-7: install from the locked/dev files instead of a hand-written list.
      # requirements-lock.txt is fully resolvable (gradio pins that conflicted
      # with websockets==15.0.1 were removed; PyJWT was added — it is required
      # by tos.security.tokens and was missing from the lock).
      - name: Install dependencies (lock + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-lock.txt
          pip install -r backend/requirements-dev.txt

      - name: Run unit tests
        run: cd backend && python -m pytest tests -q --tb=short

      - name: Verify hash integrity
        run: |
          cd backend
          python -c "
          import sys; sys.path.insert(0, '.')
          from tos.governance.station_sop import compute_canon_hash, compute_law_semantic_hash
          from tos.governance.modality_matrix import compute_matrix_hash
          import pathlib
          c = compute_canon_hash()
          m = compute_matrix_hash()
          s = compute_law_semantic_hash()
          assert c == '6a9cd4b4349b81de', f'Canon drifted: {c}'
          assert m == 'ed1731ace09a9a3bd24d3659ab6f3fd184da2a2335d935a234fd6a9c14880aa4', f'Matrix drifted: {m}'
          # WP-SCI-1: the semantic law hash binds thresholds, units, operators,
          # scopes, measurement containment and modality rules. A mismatch means
          # law MEANING drifted without an explicit reviewed re-pin — fail the
          # gate until governance/law_semantic.sha256 is updated in the PR.
          pinned = pathlib.Path('../governance/law_semantic.sha256').read_text().strip()
          assert s == pinned, (
            'Law semantic hash drifted: '
            f'computed={s} pinned={pinned}. Law definitions/thresholds/status '
            'semantics changed without a reviewed update — update '
            'governance/law_semantic.sha256 explicitly in this PR with the new value '
            'and justification, or revert the semantic change.'
          )
          print(f'Canon:    {c}')
          print(f'Matrix:   {m[:16]}...')
          print(f'Semantic: {s[:16]}...')
          print('All hashes verified.')
          "
