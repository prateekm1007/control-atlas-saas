name: Toscanini Stability Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks (pinned v8.30.1)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan HEAD tree — fails on any finding
        run: /tmp/gitleaks detect --no-git --redact --exit-code 1 -v

  unit-tests:
    name: Unit Tests + Hash Lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # WP-7: install from the locked/dev files instead of a hand-written list.
      # requirements-lock.txt is fully resolvable (gradio pins that conflicted
      # with websockets==15.0.1 were removed; PyJWT was added — it is required
      # by tos.security.tokens and was missing from the lock).
      - name: Install dependencies (lock + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-lock.txt
          pip install -r backend/requirements-dev.txt

      - name: Run unit tests
        run: cd backend && python -m pytest tests -q --tb=short

      - name: Verify hash integrity
        run: |
          cd backend
          python -c "
          import sys; sys.path.insert(0, '.')
          from tos.governance.station_sop import compute_canon_hash
          from tos.governance.modality_matrix import compute_matrix_hash
          c = compute_canon_hash()
          m = compute_matrix_hash()
          assert c == 'f24ec581b3e04732', f'Canon drifted: {c}'
          assert m == 'ed1731ace09a9a3bd24d3659ab6f3fd184da2a2335d935a234fd6a9c14880aa4', f'Matrix drifted: {m}'
          print(f'Canon:  {c}')
          print(f'Matrix: {m[:16]}...')
          print('All hashes verified.')
          "

      - name: Verify law semantic lock
        run: |
          cd backend
          python -c "
          import hashlib, json, sys
          from pathlib import Path
          sys.path.insert(0, '.')
          from tos.governance.station_sop import LAW_CANON, LAW_METHOD_CLASSIFICATIONS
          payload = {
              'laws': {
                  law_id: {
                      'title': data['title'],
                      'threshold': data['threshold'],
                      'unit': data['unit'],
                      'operator': data['operator'],
                      'scope': data['scope'],
                      'type': data['type'],
                  }
                  for law_id, data in sorted(LAW_CANON.items())
              },
              'method_classifications': dict(sorted(LAW_METHOD_CLASSIFICATIONS.items())),
          }
          actual = hashlib.sha256(json.dumps(payload, sort_keys=True).encode('utf-8')).hexdigest()
          expected = Path('../governance/law_semantic.sha256').read_text(encoding='utf-8').strip()
          assert actual == expected, f'Law semantic lock drifted: {actual} != {expected}'
          print(f'Law semantic lock: {actual}')
          "
